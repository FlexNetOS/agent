# Agent Guard Policy — consolidated destructive-command policy (ARCHBP-031)
# Schema Version: 1.1 (adds per-pattern `decision = "deny" | "ask"`; default "deny")
#
# OWNERSHIP — one source owns each rule:
#   CANONICAL: Meta's tracked .claude/agent-guard.toml. Meta is the workspace
#     control plane and owns its tracked policy.
#   MIRROR (traceable, byte-identical): the `agent` peer's
#     policy/agent-guard.toml, which src/guard.rs pulls in with
#     include_str!("../policy/agent-guard.toml") as the embedded default
#     fallback. That path -- policy/, not .claude/ -- is the one the binary
#     actually compiles; the two copies diverged once while this line named the
#     wrong file, and each half of the drift then looked authoritative.
#   ADAPTERS may refine parsing on their own hook routes, but may not become a
#     policy source or override these decisions.
#
# Load hierarchy of the engine: ./.claude/agent-guard.toml (project) ->
# $CLAUDE_CONFIG_DIR/agent-guard.toml (user) -> embedded default. All policy
# copies used for this workspace must carry this consolidated content; a
# project-level fork is a policy fork and must be treated as an incident.
#
# The user-level copy is GENERATED and has exactly one owner. The flake installs
# the mirror as share/yazelix/agent_configs/claude/agent-guard.toml.src, and the
# Claude frontdoor writes it into the Claude home at startup. So it lags this
# file by one profile rebuild BY DESIGN, and hand-editing it creates a second
# owner of a generated file. To refresh it, land the change here, bump the
# agent input pin, and rebuild the profile -- never edit the copy in place.
#
# That lag is not harmless, and it has already cost a test. `cargo test` in the
# `agent` repo runs with no project policy in its working directory, so it fell
# through to that generated copy and asserted the behaviour of the PREVIOUS
# policy: a new rule was invisible to the suite, and a test contradicting it
# kept passing. GuardConfig::load() now short-circuits to the embedded default
# under cfg(test), so the suite tests the policy the crate ships. When a rule
# seems not to fire, print which file was loaded before concluding anything.
#
# envctl has no authority over this policy. Do not infer authority from a local
# projection, a generated file, or a tool being present on this host.
#
# RTK FRONTDOOR — MANDATORY. All Claude shell work enters through the
# profile-owned RTK binary, and the Claude PreToolUse hook routes Bash-tool
# requests through `rtk hook claude`. Agents always use bash through RTK: the
# Bash tool is the agent's shell interface, and every segment of every command
# carries the `rtk` prefix. Do not bypass that hook with an alternate binary,
# shell owner, or raw payload.
#
# RTK is the frontdoor, not the shell owner. It reaches the profile-owned
# Nushell through `rtk proxy -- /home/<user>/.nix-profile/toolbin/nu -l -c
# "command"`, which is also the documented escape hatch for a command that is
# genuinely unfilterable. Substituting sh/zsh/fish/xonsh as the shell owner is
# the bypass this paragraph forbids; using the Bash tool with the rtk prefix is
# the sanctioned path and always was. An earlier draft of this paragraph read
# "Bash/sh/zsh/fish/xonsh are owner-only", which contradicted the frontdoor rule
# this same policy enforces and the RTK.md instruction it is derived from.
#
# Enforcement is deny-by-default and lives in evaluate_rtk_frontdoor() in
# src/guard.rs, because it must match a segment whose first token is NOT rtk and
# the regex crate has no lookahead.
#
# Decision semantics: "deny" blocks the tool call AND returns the reason to the
# model; "ask" escalates to the operator. Unknown values fail closed to "deny".
# First match wins, highest priority first.
#
# AUTO-MODE LAW: every rule here is "deny", and none may be "ask".
#
# The session runs at permissions.defaultMode = "dontAsk". An "ask" does not
# become a silent allow there -- it escalates to the human and keeps prompting,
# so every "ask" rule is a babysitting event by construction. Worse, an "ask"
# message that ends "Approve for one-off inspection" promises a remedy that no
# unattended session can reach, leaving the agent with nowhere to go.
#
# A "deny" is what makes unattended operation possible: the hook contract
# returns the reason to the MODEL, which reads it and re-sends a compliant
# command with no human in the loop. So the deny message is the whole
# mechanism, and it carries one obligation:
#
#   EVERY MESSAGE MUST NAME THE EXACT COMMAND THAT IS ALLOWED.
#
# A denial that only says "no" strands the agent and costs a human round trip;
# a denial that says "use this instead" is self-correcting. When adding a rule,
# write the remedy first and the prohibition second.
#
# The guard is not a brake on auto mode; it is what makes auto mode safe. It is
# not designed to block auto mode, and it never asks the user a question. Its
# job is to hold the user's already-stated intent when a session drifts from it,
# so the user never has to answer for the same decision twice. No human in the
# loop is the standard here, not the exception. That is why a rule's message is
# addressed to the MODEL and always names the compliant command: the denial has
# to carry everything the session needs to correct itself unattended.

schema_version = "1.1"

[metadata]
source = "flexnetos-meta"
version = "0.2.0"
description = "Consolidated agent guard policy (ARCHBP-031): single source, adapters consume"

# ── Claude session containment ──────────────────────────────────────────────

[[patterns]]
id = "meta.claude.skip_permissions"
priority = 130
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '--dangerously-skip-permissions' }
message = """
LAW: --dangerously-skip-permissions is forbidden on this machine, no exceptions.
"""

[[patterns]]
id = "meta.claude.nested_session"
priority = 120
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '^\s*(rtk\s+|sudo\s+)?claude(\s|$)' }
validator = { type = "all_of", validators = [{ type = "not_contains", value = "--version" }, { type = "not_contains", value = "claude update" }, { type = "not_contains", value = "claude doctor" }] }
message = """
Nested Claude sessions are denied (recursion containment). Allowed:
'claude --version', 'claude update', 'claude doctor'. Use teams/subagents/background
bash instead. (Baseline rule; guard-bash.sh refines with quote-aware parsing.)
"""

# ── git topology protection ─────────────────────────────────────────────────

[[patterns]]
id = "meta.git.force_push_longlived"
priority = 110
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*(--force|-f\b|\s\+\S+)' }
validator = { type = "args_match_any", command = "push", values = ["main", "master", "develop", "+main", "+master", "+develop"] }
message = """
Force-push (any variant, including --force-with-lease and +refspec) touching
main/master/develop is forbidden — long-lived branches are upgrade-only history.
"""

[[patterns]]
id = "meta.git.force_push"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*(--force|-f)\b' }
validator = { type = "not_contains", value = "--force-with-lease" }
message = """
git push --force in a multi-repo workspace can overwrite history across \
multiple repos. Safer alternatives:
- git push --force-with-lease on a private feature branch (operator-approved)
- meta --include <repo> exec -- git push (target one repo)
- meta git snapshot create <name> before risky pushes
"""

[[patterns]]
id = "meta.git.push_refspec_force"
priority = 95
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*\s\+\S+' }
message = """
'+refspec' push force-updates the remote ref and can discard commits that are
already published. Reconcile instead of overwriting:
  rtk git pull --rebase origin <branch> && rtk git push origin <branch>
To publish a diverged local line without touching the shared one:
  rtk git push origin HEAD:refs/heads/<new-branch>
"""

[[patterns]]
id = "meta.git.force_push_lease"
priority = 90
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*--force-with-lease' }
message = """
--force-with-lease still rewrites remote history; the lease only checks that
nobody pushed since your last fetch. Reconcile instead of rewriting:
  rtk git pull --rebase origin <branch> && rtk git push origin <branch>
To publish a diverged local line without touching the shared one:
  rtk git push origin HEAD:refs/heads/<new-branch>
"""

[[patterns]]
id = "meta.git.branch_force_delete_longlived"
priority = 110
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+branch.*\s+-[a-zA-Z]*D[a-zA-Z]*(\s|$)' }
validator = { type = "args_match_any", command = "branch", values = ["main", "master", "develop"] }
message = """
Topology invariant: main/master/develop are long-lived and never force-deleted.
"""

[[patterns]]
id = "meta.git.branch_force_delete"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+branch.*\s+-[a-zA-Z]*D[a-zA-Z]*(\s|$)' }
message = """
git branch -D force-deletes branches, potentially losing unmerged work. \
Safer alternatives:
- git branch -d <branch> (safe delete — only works if merged)
- git branch -v to check merge status first
- meta git snapshot create <name> before deleting
"""

[[patterns]]
id = "meta.git.history_rewrite"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git[-\s]+filter-branch|git[-\s]+filter-repo|git\s+reflog\s+expire.*--expire|git\s+gc\b.*--prune=now' }
message = """
History rewrites / reflog destruction are forbidden (LAW 1 + upgrade-only).
Archive instead.
"""

[[patterns]]
id = "meta.git.reset_hard"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+reset.*--hard\b' }
message = """
git reset --hard destroys uncommitted work. In a multi-repo workspace, \
this can silently discard changes across repos. Safer alternatives:
- meta git snapshot create <name> (save state first)
- meta git snapshot restore <name> (reversible reset)
"""

[[patterns]]
id = "meta.git.clean_force"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+clean' }
validator = { type = "flags_present", command = "clean", flags = ["f", "d"] }
message = """
git clean -fd removes untracked files and directories permanently. \
Safer alternatives:
- git clean -nd (dry run — preview what would be removed)
- meta git snapshot create <name> before cleaning
"""

[[patterns]]
id = "meta.git.checkout_dot"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+checkout\s+(--\s+)?\.(\s|$)' }
message = """
git checkout . reverts all modified files. Safer alternatives:
- git checkout -- <specific-file> (target specific files)
- meta git snapshot create <name> before reverting
"""

[[patterns]]
id = "meta.git.stash_drop"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+stash\s+drop\b' }
message = """
git stash drop permanently removes a stash entry. Safer alternatives:
- git stash list to review what will be dropped
- git stash show <stash> to inspect contents first
- git stash apply <stash> instead of pop (preserves the stash)
"""

[[patterns]]
id = "meta.git.stash_clear"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+stash\s+clear\b' }
message = """
git stash clear removes ALL stash entries permanently. Safer alternatives:
- git stash list to review what will be cleared
- git stash drop <stash> to remove specific entries one at a time (guarded)
- meta git snapshot create <name> before clearing (captures all stashes)
"""

# ── filesystem protection ───────────────────────────────────────────────────

[[patterns]]
id = "meta.rm.dangerous_paths"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'rm\s+' }
validator = { type = "all_of", validators = [{ type = "flags_present", command = "rm", flags = ["r", "f"] }, { type = "args_match_any", command = "rm", values = [".", "..", "/", "~", "$HOME", ".meta", ".meta.yaml", ".meta.yml", "*", "./*", "../*", "./"] }] }
message = """
rm -rf on dangerous paths could destroy repo roots or workspace data. \
LAW 1: never delete, always archive. Safer alternatives:
- Remove specific scratch files instead of entire directories
- meta --dry-run exec -- <cmd> to preview operations
- meta git snapshot create <name> before destructive operations
(Hook adapters may apply parser refinements, but this policy remains the
decision source.)
"""

# This deliberately uses only the validator schema shipped before the
# quote-aware path matcher. A project policy can arrive before its rebuilt
# guard binary; this matcher keeps protected Meta manifests denied during that
# independent-repository rollout window.
[[patterns]]
id = "meta.rm.protected_manifest"
priority = 101
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'rm(?:\s+[-\w=]+)*\s+(?:["\x27]?(?:(?:\./|\.\./)|(?:[^\s"\x27]+/))*["\x27]?)?\.meta(?:["\x27]?\.ya?ml)?["\x27]?(?:/)?(?:\s|$)' }
message = """
Deleting a protected Meta manifest is forbidden. Preserve control-plane
metadata; use a reviewed migration or archive workflow instead.
"""

# ── path law ────────────────────────────────────────────────────────────────
#
# PATH LAW IS ABSOLUTE. All paths follow upstream Yazelix. No loopholes, no
# exceptions, and no per-tool carve-outs -- an exception carved for one variable
# is how the last violation survived five sessions. It binds every agent and
# every tool equally: the rules below are the only ones evaluated against file
# payloads as well as commands, so a forbidden path is forbidden whichever tool
# writes it (evaluate_path_law_for_target in src/guard.rs, and the `cmd` field
# so Codex is covered on the same terms as Claude).
#
# The one entitlement is narrow and structural, not a loophole: a `.nix` file
# may PRODUCE a surface's value, because a derivation is the builder. That
# covers exactly three rules (NIX_AUTHORED_SURFACE_RULES) and nothing else.
#
# SOURCING LAW, and the reason this section exists at all:
#
#   A rule may encode a DOCUMENTED SURFACE -- a variable whose owner defines it.
#   Upstream yazelix owns YAZELIX_STATE_DIR and the YZX_* binary surfaces; the
#   XDG spec owns XDG_CONFIG_HOME and XDG_RUNTIME_DIR; cargo owns CARGO_HOME;
#   each agent owns its own home variable.
#
#   A rule may NEVER encode THIS HOST'S POLICY about where a surface points.
#   That is not law, it is local configuration, and freezing it into a guard
#   makes the configuration permanent by making it enforced.
#
# Two rules were removed for violating exactly that. `durable_cache_on_volatile`
# denied five cache variables from resolving under the runtime dir, and
# `cache_surface_hardcoded` asserted twelve vendor caches must derive from
# XDG_CACHE_HOME. Both were read off this machine's nushell config layer -- a
# file that does not exist upstream -- so the guard had begun protecting the
# drift it was written to stop. A census of the box is not a source of truth;
# it is a description of the damage.
#
# What remains is shape, not location. The rules below fire on the FORM of a
# path -- a dotdir under a user home, build state on a runtime tmpfs, a store
# path pinned by hash, a documented surface assigned a literal -- and none of
# them names a directory this profile chose. They hold for any user, at any
# uid, on any box, which is the test for whether a rule belongs here.
#
# Upstream Yazelix's resolver is the reference shape: a precedence chain over
# surfaces, ending in a fallback (runtime/yzx/paths.rs):
#
#   state   YAZELIX_STATE_DIR -> $XDG_DATA_HOME/yazelix
#             -> $HOME/.local/share/yazelix -> /tmp/yazelix
#   config  YAZELIX_CONFIG_HOME -> $XDG_CONFIG_HOME/yazelix
#             -> $HOME/.config/yazelix
#
# Both terminal fallbacks are upstream-documented and MUST stay permitted.
# Reaching one means no surface was set; the repair is to set the surface, never
# to fight the path. Empty is unset -- upstream reads through nonempty_env.
#
# This policy is host-agnostic and guards writes. Host repair authority must be
# proven separately; it is never conferred by a local tool or projection.

[[patterns]]
id = "paths.dotlocal_tool_state"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(/home/[^/\s]+|\$HOME|~)/\.(local/(share|state)|config)/(icm|rtk|weave|atc|env-ctl|ccboard)' }
message = """
FlexNetOS tool state is reached through the XDG surface, never by naming a path
under the user home.
  data   -> $XDG_DATA_HOME/<tool>
  state  -> $XDG_STATE_HOME/<tool>
Both are exported by the profile frontdoor, so the tool's own XDG resolution
finds them with no path in your command at all.

If a tool is landing under ~/.local anyway, its surface is unset in that
process -- repair the owning configuration, not the path in an agent command.
"""

[[patterns]]
id = "paths.agent_home_shadow"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(/home/[^/\s]+|\$HOME|~)/\.(codex|claude|gemini|copilot)($|[/\s"\x27:,;)\]}])' }
message = """
Each agent home is a surface, not a path. Read the variable:
  CODEX_HOME   CLAUDE_CONFIG_DIR   GEMINI_CONFIG_DIR   COPILOT_HOME
The owning agent frontdoor may reject a competing home by byte-for-byte string
comparison, so writing ~/.codex or ~/.claude does not merely look untidy -- it
can make that agent refuse to launch. Change an agent home only through its
proved owner.
"""

[[patterns]]
id = "paths.build_state_on_runtime_dir"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(CARGO_HOME|CARGO_TARGET_DIR|RUSTUP_HOME|GOCACHE|GOMODCACHE)\s*=\s*[^\s]*(/run/user/\d+|\$XDG_RUNTIME_DIR)' }
message = """
Build state must not resolve under $XDG_RUNTIME_DIR. That is a tmpfs whose
budget is shared with the wayland socket, dconf, dbus and gnome-keyring, and it
is cleared on logout -- a workspace build reached 30G there and drove it to 84%.
The symptom is a binary that "does not exist" right after cargo reports success.
Use the durable surface: $CARGO_HOME / $CARGO_TARGET_DIR are already exported.
Never assume ./target either -- ask cargo where it actually put things:
  cargo metadata --format-version 1 --no-deps | jq -r .target_directory
$XDG_RUNTIME_DIR is correct for genuinely disposable caches, and only those.
"""

[[patterns]]
id = "paths.yazelix_surface_hardcoded"
priority = 160
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(YAZELIX_STATE_DIR|YAZELIX_CONFIG_HOME|XDG_CONFIG_HOME|XDG_DATA_HOME|XDG_STATE_HOME|XDG_CACHE_HOME|XDG_RUNTIME_DIR|CODEX_HOME|CLAUDE_CONFIG_DIR|GEMINI_CONFIG_DIR|COPILOT_HOME|CARGO_HOME|CARGO_TARGET_DIR|TMPDIR)\s*=\s*[\x27"]?/' }
message = """
This assigns a surface an absolute literal. Surfaces are what make upstream
work for any user on any box, so pinning one to a path is how a host stops
being reproducible.

Upstream Yazelix's shape is a precedence chain, not an assignment:
  YAZELIX_STATE_DIR -> $XDG_DATA_HOME/yazelix -> $HOME/.local/share/yazelix

A surface may be pinned only by its proved owner -- Yazelix's profile
frontdoor -- and that entitlement is automatic when you are editing a .nix
file, because a derivation is the builder that produces the value. A pinned
value can require byte-for-byte identity with the frontdoor's own value when
the owner compares raw strings.

Everywhere else, read the surface instead of setting it:
  nu   -> $env.XDG_DATA_HOME          sh -> "$XDG_DATA_HOME"
Never hand-edit the owner's live configuration table; use that owner's
documented committer.
"""

# ── upstream Yazelix: what it directs ───────────────────────────────────────
#
# Read against upstream/main (luccahuguet/yazelix) at 81cfbfaf on 2026-07-31 --
# by reading the tree, not by recalling it. These are answers the project already
# published, so do not re-derive them, do not re-litigate them, and never ask the
# user a question one of them already answers. Each line was paid for once by an
# agent that invented instead of reading. The fork diverges from most of them, so
# a remedy that contradicts one is wrong before it is run.
#
# GOVERNANCE, quoted from upstream AGENTS.md:
#
#   Core Rule       "The user decides scope. Do not create a feature,
#                   compatibility surface, module, or planning bead until the
#                   user has chosen that direction"
#   Method 3 and 6  "Choose one owner in this repo" / "Avoid duplicate owners,
#                   adapters, generated fixtures, and compatibility shims"
#   Git workflow    "Work directly on `main` by default. Do not create a
#                   separate branch unless the user explicitly requests one or
#                   another repository instruction requires it." `stable` is "a
#                   promotion-only user channel", advanced only by pushing an
#                   exact verified SHA -- "git push origin <sha>:stable; never
#                   force-push or delete `stable`" -- and rolled back with a new
#                   revert commit on main, never a rewrite
#
#  1 HARD-CODED PATHS  Upstream has no host-placement literal acting as a
#                      runtime/config owner. A controlled whole-tree search does
#                      find absolute literals in CI cleanup, maintainer and docs
#                      examples, architecture prose, and executable candidate
#                      tests. Those are evidence or candidates, not placement
#                      authority. The startup boundary is "Owned by runtime/yzx/
#                      (Nix substitutes paths; Rust owns wiring and exec)":
#                      literals are produced by the derivation, and every surface
#                      is a precedence chain, never an assignment
#                      (runtime/yzx/paths.rs):
#                        config  YAZELIX_CONFIG_HOME -> $XDG_CONFIG_HOME/yazelix
#                                -> $HOME/.config/yazelix, else a startup error
#                        state   YAZELIX_STATE_DIR -> $XDG_DATA_HOME/yazelix
#                                -> $HOME/.local/share/yazelix, ending in the
#                                literal /tmp fallback named in the header above
#                      Every read goes through nonempty_env(), so EMPTY IS UNSET.
#
#  2 CARGO AND FENIX   Upstream sets NO cargo home and NO cargo target dir
#                      anywhere, and ships no rust-toolchain file. Fenix IS
#                      upstream but arrives TRANSITIVELY: it is absent from all
#                      14 root inputs and enters through four component flakes --
#                      yazelixScreen, yazelixZellijBar,
#                      yazelixZellijPaneOrchestrator, yazelixZellijPopup. Read
#                      flake.lock NODES, not flake.nix declarations, before
#                      claiming what is upstream, and derive the list rather than
#                      recalling it -- an earlier revision of this line named
#                      yazelixHelix, which takes no fenix input at all:
#                        jq -r '[.nodes | to_entries[]
#                                | select(.value.inputs.fenix != null)
#                                | .key] | sort | .[]' flake.lock
#                      This fork's flake.nix composes fenix and owns it
#                      (see paths.rustup_not_used).
#
#  3 AGENT CONFIG      Semantic keys in config.toml, never a config tree:
#                      agent.command (an executable string, or "auto" to keep the
#                      built-in fallback), agent.args, keybindings.agent.
#                      runtime/yzx-agent.rs bootstraps providers BY NAME -- codex,
#                      grok, opencode, pi, claude -- selecting the first that is
#                      actually on PATH with the executable bit set, then
#                      remembering the choice as one line in
#                      <state_dir>/agent/provider. Agents are COMMANDS.
#
#  4 RUNTIME CONFIG    One preparer, one application. Runtime::prepare_with()
#                      (runtime/yzx/runtime.rs) resolves the surfaces, creates the
#                      state dir, and reads every semantic value through the
#                      yzx-config helper: open.log_level, shell.program,
#                      editor.command, agent.command, agent.args, welcome.*,
#                      appearance.mode, bar.widgets, popup.*, keybindings.
#                      Runtime::apply() then stamps that one prepared environment
#                      onto whatever is launched -- YAZELIX_CONFIG_HOME,
#                      YAZELIX_STATE_DIR, EDITOR, VISUAL, GIT_EDITOR, YZX_EDITOR,
#                      YZX_OPEN_LOG, YZX_ZELLIJ, YZX_YAZI_BIN, YZX_YA,
#                      YAZELIX_STATUS_BAR_CACHE_PATH, MARS_CONFIG_HOME, PATH.
#                      No shell profile, no session tier and no service manager
#                      appears anywhere in that path.
#
#  5 ACTIVE CONFIG     crates/yzx-config/src/paths.rs config_paths() builds every
#                      active path from home.join(..) under the config root:
#                      config.toml, cursors.toml, mars/config.toml,
#                      zellij/config.kdl, zellij/plugins.kdl, starship.toml,
#                      helix/*, yazi/*, nu/{env,config}.nu. Host
#                      ~/.config/{helix,yazi,starship} is "Not loaded by default".
#                      The same module carries is_home_manager_owned() and
#                      reject_mutation(), which REFUSE to mutate a generated file
#                      and name the owning option instead of writing it.
#
#  6 ADDING A TOOL     home.packages in the flake and in the home-manager module
#                      (home-manager/module.nix: home.packages = [cfg.package],
#                      whose option doc reads "The package owns the command and
#                      any desktop entry it provides"). A new dependency or
#                      toolchain is a flake input, hacked locally with
#                      nix run --override-input <name> ../<repo> and proved by
#                      nix flake check. "flake.nix owns the package graph".
#
#  7 .claude AND       Upstream ships AGENTS.md only, and has NO .claude and NO
#    .codex            .codex tree anywhere in the tree. An agent home is that
#                      agent's own surface, owned by the agent, never carried
#                      inside yazelix (see paths.agent_home_shadow).
#
#  8 DATABASES AND     Upstream ships no database -- no postgres, sqlite or redb
#    BINARIES          appears in any upstream .nix. Every binary arrives from the
#                      store through packages and is reached through the profile
#                      frontdoor, never by store hash and never from a host
#                      install (see paths.nix_store_hardcoded).
#
#  9 NUSHELL ENV       Packaged first, user after. Upstream ships exactly two Nu
#                      files -- defaults/nu/config.nu (prompt only) and
#                      defaults/nu/env.nu (one line) -- and sets no paths and
#                      creates no directories in either. The generated runtime
#                      env.nu does a source-env of the USER's nu/env.nu, whose
#                      starter text is literally "Loaded after Yazelix Nova
#                      packaged env.nu" (crates/yzx-config/src/catalog.rs,
#                      NU_ENV_STARTER). The layering is "Packaged -> optional host
#                      mise activate nu -> optional user Nu". The packaged layer
#                      is the shell-scope owner. There is no session-scope tier.
#
# 10 yzx enter AND     Both use exec_managed() in
#    yzx launch        runtime/yzx/cli.rs: prepare the runtime with Yazi, build
#                      the managed Zellij command with the packaged config and
#                      layout, apply() the whole prepared environment, exec.
#                      `enter` starts Yazelix in the current terminal; `launch`
#                      opens Mars and starts the same workspace inside it.
#                      Upstream stops at that handoff and contains no FlexNetOS
#                      runner or database integration. The owner's FlexNetOS law
#                      is stronger: yzx enter and yzx launch launch everything in
#                      Yazelix, including the runner and databases. That remains
#                      a fork-owned runtime contract and MUST be proved by a
#                      behavioral test before anyone says it is implemented.
#                      Path law is absolute because one prepared environment is
#                      inherited by every descendant for the life of the
#                      session; C1 proves the same mechanism for
#                      `yzx run <program>`.
#
# 11 TERMINAL          OWNER LAW: the terminal emulator with the most advanced
#    EMULATOR          capabilities always wins, proven by test not by guessing.
#                      Upstream does not implement a generic ranking. It makes
#                      Mars the first-class packaged GUI used by yzx launch and
#                      routes host terminals through yzx enter; this fork's
#                      terminal-support metadata packages and tests Mars as the
#                      sole launch terminal. Capability is proved at the
#                      selection boundary:
#                        - managed_program() REFUSES yzx launch when the package
#                          omits Mars ("use yzx enter or select a package that
#                          includes Mars") rather than degrading to a lesser one
#                        - the desktop entry exists only when Mars is present
#                          (withDesktop = withMars && isLinux)
#                        - support_kitty_keyboard_protocol is in
#                          ZELLIJ_FORBIDDEN_TOP_LEVEL, so the packaged layer owns
#                          it and a user sidecar cannot downgrade it
#                        - yzx doctor probes reality: require_file() stats every
#                          packaged path, require_command() resolves the command
#                          on the runtime PATH, and the Yazi version is read from
#                          the binary and compared with YAZI_TESTED_VERSION
#                      Prove a capability with a probe like those. Never infer one
#                      from a name, a version string, or a reputation.
#
# 12 DESKTOP APP       The desktop entry is produced by the flake, never written
#                      by hand: pkgs.makeDesktopItem with exec set to the yzx
#                      command's absolute store path plus `launch`, terminal set
#                      false, categories System/TerminalEmulator, and
#                      withDesktop = withMars && isLinux. A GUI launch therefore
#                      never depends on a session PATH. Configure the GUI through
#                      the desktop entry the package owns, and the shell through
#                      managed Nu. Upstream has already answered this; there is no
#                      third place to invent.
#
# 13 NO systemd,       Neither appears upstream AT ALL. A whole-tree search of
#    NO tmpfs          upstream/main for systemd, environment.d, tmpfs and
#                      /run/user returns ZERO hits, against a control search that
#                      returns matches on the same tree. Upstream's only volatile
#                      fallback is the literal /tmp last resort in state_dir(),
#                      and reaching it means no surface was set. So a systemd
#                      unit, an environment.d drop-in, or build state on a runtime
#                      tmpfs is never "how upstream does it" -- it is a tier
#                      upstream does not have (see paths.session_env_ownership and
#                      paths.build_state_on_runtime_dir).
#
# ── FlexNetOS additions: this fork owns these, upstream does not ────────────
#
# Kept separate on purpose. Attributing a fork behaviour to upstream is a
# sourcing-law violation and it has already happened: a draft rewrote
# paths.tmpdir_hardcoded to assert that upstream never falls back to a temp dir,
# which describes the FORK's fallible resolver, not upstream's infallible one.
# Upstream's terminal fallbacks stay permitted.
#
#   NODE LANE        bun and bun x are the drop-in replacements for npm and npx.
#                    The flake contract asserts bun is 1.3.14, and asserts npm,
#                    npx, pnpm, corepack and yarn are ABSENT
#                    from the profile -- so a remedy naming them is broken before
#                    it is run (install.global_node_package,
#                    install.node_lane_absent).
#   LATEST RELEASES  Track the latest release rather than freezing an old one:
#                    run a tool through the Bun lane at @latest
#                    (rtk bun x --bun <tool>@latest), refresh the installation
#                    through its one declared owner, and move a flake input's pin
#                    forward instead of installing outside the flake. Upstream
#                    makes updates explicit and one-owner; "not the newest
#                    release" has no static regex shape, so the guard names the
#                    current action and never pretends it is itself an updater.
#   SHELL ENTRY      Every agent shell command enters through RTK -- see RTK
#                    FRONTDOOR at the top of this file.
#   ICM STORAGE      ICM uses BOTH SQLite and PostgreSQL. The published binary
#                    carries all backends and selects one at RUNTIME through
#                    ICM_DB_BACKEND; SQLite is the in-process default, and --db /
#                    ICM_DB set its path, which the remote backends ignore. Do not
#                    assume a single backend when reading or repairing its corpus,
#                    and do not "fix" a backend by naming a path in a command
#                    (see paths.dotlocal_tool_state).

[[patterns]]
id = "paths.session_env_ownership"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '((^|[\s;&|(])(cp|mv|ln|install|tee|touch|rsync)\s[^;&|]*|>>?\s*)[^\s;&|]*environment\.d/|writeTextDir\s+"[^"]*environment\.d/' }
message = """
This writes a systemd environment.d drop-in. That directory is read by the
systemd USER MANAGER -- the parent of gnome-session and every desktop app -- so
a file there owns the entire graphical session, not a dev shell. A redirected
data root placed there once handed GNOME a fresh empty login keyring.

Upstream Yazelix has no such layer, and its contracts already say where each
scope lives:
  C8     the desktop entry starts yzx by its absolute profile path, so a GUI
         launch never depends on a session PATH
  C1     `yzx run <program>` reuses the prepared environment
  shell  the managed Nu config, which runs per-shell and wins over session scope
Configure the GUI through the desktop entry and the shell through managed Nu.
There is no third scope to add, and no exception that reintroduces one.

This is upstream's Method 6 -- "Avoid duplicate owners, adapters, generated
fixtures, and compatibility shims" -- and its Core Rule: "The user decides scope.
Do not create a feature, compatibility surface, module, or planning bead until
the user has chosen that direction." A session-env tier is a duplicate owner of
what the packaged Nu layer already owns. Do not ask which scope should carry a
value either; point 12 of the upstream section above already answers it, and
point 13 records that systemd does not appear upstream at all. A violation is a
violation, and an exception carved for one variable is how the last one survived
five sessions.

Reading, listing or grepping environment.d is not matched here -- only writing.
"""

[[patterns]]
id = "paths.code_discipline_generated_copy"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(\A|(^|[\s;&|(])(cp|mv|ln|install|tee|touch|rsync)\s[^;&|]*|>>?\s*)[^\s;&|]*var/lib/claude/CODE-DISCIPLINE\.md' }
validator = { type = "not_contains", value = ".claude/CODE-DISCIPLINE.md" }
message = """
Regenerate this copy from its canonical source instead of editing it:

  rtk cp /home/flexnetos/meta/.claude/CODE-DISCIPLINE.md /home/flexnetos/meta/var/lib/claude/CODE-DISCIPLINE.md

The 10 laws have one owner and one producer, so they read the same in every
session:
  CANONICAL  meta's tracked .claude/CODE-DISCIPLINE.md, which meta's CLAUDE.md
             loads as @.claude/CODE-DISCIPLINE.md
  DERIVED    this copy in the Claude home, which that home's CLAUDE.md loads as
             @CODE-DISCIPLINE.md

/var/ is gitignored, so a hand edit here appears in no diff and the two copies
drift silently -- the same failure the generated user-level policy copy already
caused once. Editing a generated file in place creates a second owner of it.

A cp whose source is the canonical file is allowed, and reading, listing or
grepping the derived copy is not matched here -- only writing it.
"""

[[patterns]]
id = "paths.surface_pinned_in_source"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '["\x27]/' }
message = """
This pins an absolute path inside a Nushell runtime source file. Upstream's startup
boundary is "Owned by runtime/yzx/ (Nix substitutes paths; Rust owns wiring and
exec)" -- the derivation produces every path, and the source carries only a
placeholder. Path law is absolute: no loophole, no exception, no second owner.

Use the already-established substitution form:

  in the .nu source     let cargo_home = "@cargoHome@"
  in flake.nix          flexnetosNuConfigFor = pkgs: pkgs.replaceVars ./... {
                          inherit cargoHome;
                        }

replaceVars is fail-closed -- an unsubstituted placeholder breaks the build
instead of shipping a literal. Define the value once and pass it to every
consumer; a second attribute set repeating it is the duplicate owner Method 6
forbids.

This file-only rule is target-aware in evaluate_path_law_for_target(): it scans
every non-comment line of a .nu destination, including let/const/list/audit
forms, and scans only added lines in apply_patch payloads. A removed violation
therefore stays removable. Markdown evidence and .nix producer values are not
Nushell source and are not matched here.
"""

[[patterns]]
id = "paths.nix_store_hardcoded"
priority = 150
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(^|["\x27=\s])/nix/store/[a-z0-9]{32}-' }
message = """
This names a /nix/store path by hash. Store paths change on every rebuild, so a
pinned one is stale as soon as anything upstream of it moves.
  in nix   -- reference the derivation, or builtins.storeDir
  at run   -- $YAZELIX_NIX_STORE_ROOT, which upstream sets from builtins.storeDir
  on PATH  -- the profile frontdoor, /home/<user>/.nix-profile/toolbin/<tool>
To inspect what the profile actually resolves to, derive it instead of pinning:
  rtk nix profile list --profile <profile> --json | rtk jq -r '..|.storePaths?|arrays|.[]'
"""

[[patterns]]
id = "paths.rustup_not_used"
priority = 150
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'RUSTUP_HOME|rustup\s+(install|default|toolchain|override)' }
message = """
This profile has no rustup. The Rust toolchain comes from FENIX
(nix-community), composed in the yazelix flake:

  flexnetosRustToolchain = fenixPkgs.combine [cargo rustc rustfmt clippy rust-analyzer]

fenix REPLACES rustup -- the MSRV lane even wraps cargo with
--unset RUSTUP_TOOLCHAIN. Setting RUSTUP_HOME or invoking rustup introduces a
second toolchain owner. To change the toolchain, edit the flake input.
"""

[[patterns]]
id = "paths.profile_package_for_build_input"
priority = 150
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'nix\s+profile\s+(add|install).*(openssl|pkg-config|onnxruntime|zlib|sqlite)|PKG_CONFIG_PATH=' }
message = """
C build inputs come from a derivation's buildInputs -- never from the user
profile, and never from PKG_CONFIG_PATH in a shell config. Adding one to the
profile makes the build succeed for you and fail for everyone else. That is
drift, not a fix.

Working example -- packaging/icm_release.nix:
  nativeBuildInputs = [ pkgs.pkg-config ];
  buildInputs       = [ pkgs.openssl pkgs.onnxruntime ];
  OPENSSL_NO_VENDOR = "1";

If a raw `cargo build` fails on a -sys crate, build it through nix, or use the
CI devshell that already carries pkg-config:
  nix develop path:<yazelix>#ci
"""

[[patterns]]
id = "paths.binary_surface_hardcoded"
priority = 160
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(YZX_ZELLIJ|YZX_YAZI_BIN|YZX_YA|YZX_EDITOR|YZX_MENU_YZX|YZX_OPEN_LOG|YAZELIX_AGENT_LAUNCHER|YAZELIX_PACKAGED_YAZI|YAZELIX_EDITOR|EDITOR|VISUAL|GIT_EDITOR|SHELL)\s*=\s*["\x27]?/' }
message = """
This pins a BINARY surface to a path. Upstream locates its own tools through
these, each set from a nix derivation, so pinning one to a literal detaches the
tool from the closure that built it and outlives the rebuild that moved it.

  YZX_ZELLIJ  YZX_YAZI_BIN  YZX_YA  YZX_EDITOR  YZX_MENU_YZX  YZX_OPEN_LOG
  YAZELIX_AGENT_LAUNCHER  YAZELIX_PACKAGED_YAZI

Upstream reads them with a fallback to the bare command name, e.g.
  zellij: nonempty_env("YZX_ZELLIJ").unwrap_or_else(|| "zellij".into())
so an unset surface is a supported state -- resolution falls back to PATH, which
the profile owns. Read the surface; let nix set it, or just call the bare
command name and let the profile's PATH resolve it.

A .nix file may set these freely -- that is the derivation producing the value,
and this rule does not fire there.
"""

[[patterns]]
id = "paths.tmpdir_hardcoded"
priority = 140
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(^|["\x27=\s])/tmp/[A-Za-z0-9._-]' }
message = """
This writes to /tmp directly. Use $TMPDIR for scratch files when the program
supports that surface.

Upstream Yazelix state resolution has a distinct literal last-resort fallback:
/tmp/yazelix. That fallback does not honour $TMPDIR; set YAZELIX_STATE_DIR or
XDG_DATA_HOME when state must resolve elsewhere.

For a scratch file, write under $TMPDIR rather than naming /tmp yourself:
  nu -> ($env.TMPDIR | path join "name")    sh -> "$TMPDIR/name"
"""

[[patterns]]
id = "paths.config_surface_hardcoded"
priority = 160
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(YAZELIX_HELIX_MANAGED_CONFIG_PATH|YAZELIX_HELIX_BRIDGE|YAZELIX_NIX_STORE_ROOT|YAZELIX_STATUS_BAR_CACHE_PATH|YAZELIX_CURSOR_CONFIG|YZX_YAZI_STARSHIP_CONFIG|HELIX_STEEL_CONFIG|LG_CONFIG_FILE)\s*=\s*["\x27]?/' }
message = """
This pins a Yazelix-owned config or runtime-path surface. Yazelix defines these
surfaces; their values must travel with the runtime or resolver that owns them,
not with an arbitrary shell command.

  YAZELIX_HELIX_MANAGED_CONFIG_PATH   YAZELIX_HELIX_BRIDGE
  YAZELIX_STATUS_BAR_CACHE_PATH       YAZELIX_CURSOR_CONFIG
  YZX_YAZI_STARSHIP_CONFIG            HELIX_STEEL_CONFIG
  LG_CONFIG_FILE

Read the surface. A .nix file may set these freely -- that is the Yazelix
source layer producing the value, and this rule does not fire there.
"""

[[patterns]]
id = "paths.yazelix_packaged_config_layer"
priority = 161
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'nushell/[^\n]*\.nu' }
message = """
This writes a PACKAGED Nushell layer file. Upstream Yazelix ships exactly two Nu
files -- defaults/nu/config.nu (prompt only) and defaults/nu/env.nu (one line) --
and sets no paths and creates no directories in either. It has no nushell/ layer
at all, so every file there is a fork addition and belongs in the user config
root, which upstream documents as loading AFTER the packaged layer.

The rule does not test what the file CONTAINS. Gating on content -- a surface
assignment, a directory creation -- left every other way of writing the same
host configuration through, and the layer itself is the divergence.

Upstream's config layering is: packaged first, unless a surface opts into
native replacement.

  $YAZELIX_CONFIG_HOME/
    config.toml              # optional sparse semantic overrides
    cursors.toml             # shared cursor selection/effects; seeded once
    mars/config.toml         # optional sparse Mars overrides
    zellij/config.kdl        # guarded scalar sidecar
    zellij/plugins.kdl       # extra plugins only
    starship.toml            # optional sparse prompt overrides
    nu/{env,config}.nu       # after packaged Nu
    helix/*                  # lazy; created on tab use
    yazi/{yazi.toml,theme.toml,package.toml,starship.toml,init.lua,keymap.toml,plugins/,flavors/}

The root resolves YAZELIX_CONFIG_HOME -> $XDG_CONFIG_HOME/yazelix ->
~/.config/yazelix. Runtime state defaults to $XDG_DATA_HOME/yazelix or
YAZELIX_STATE_DIR.

Put it in $YAZELIX_CONFIG_HOME/nu/env.nu, not in the packaged layer. Relocating
it from one packaged file to another packaged file is the same violation.

A .nix file is NOT exempt here. A derivation is entitled to produce a surface
value, which is why the surface rules skip .nix targets -- but the flake is
exactly where this layer is declared, so exempting it would put the rule's whole
subject out of reach. Removing a packaged path from the flake is an ordinary
edit and does not trip this rule; adding or keeping one does.
"""

# ── install law ─────────────────────────────────────────────────────────────
#
# One profile owns every binary. A tool arrives by being DECLARED, not by being
# installed: a flake input pinned to an exact commit, a packaging derivation, a
# frontdoor wrapper, an entry in the executables map, and a contract test that
# asserts it exists and behaves. Anything installed outside that pipeline is a
# second owner -- it survives no rebuild, appears in no closure, and is invisible
# to every check that proves this host is reproducible.
#
# These rules fire on the SHAPE of an out-of-band install (a package manager
# asked to place a binary on PATH for the user), and name no directory.
#
# The sanctioned cutover is deliberately NOT matched. Installing a project flake
# OUTPUT is how the profile is built:
#   nix profile add --refresh --profile <profile> github:<org>/<repo>#<output>
# What is denied is pulling an INDIVIDUAL package out of the general registry
# into the profile, which is the drift this section exists to stop.

[[patterns]]
id = "install.registry_package_into_profile"
priority = 155
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'nix\s+profile\s+(add|install)[^\n]*nixpkgs[#/]|nix-env\s+(-i\b|-iA\b|--install\b)' }
message = """
This installs an individual package from the general registry into the user
profile, creating a binary owner outside the flake closure.

Declare it instead, then rebuild:
  1. add a pinned input in flake.nix   <name>_source = { url = "github:<org>/<repo>/<sha>"; flake = false; };
  2. build it in a packaging derivation, with C deps in that derivation's buildInputs
  3. register it in the executables map so it lands in the profile toolbin
  4. add a contract test asserting the binary exists and reports its version

Installing the project's own flake OUTPUT is untouched by this rule and remains
the way to cut over:
  rtk nix profile add --refresh --profile <profile> github:<org>/<repo>#<output>
To just run something once without owning it: rtk nix run nixpkgs#<pkg> -- <args>
"""

[[patterns]]
id = "install.cargo_install"
priority = 155
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'cargo\s+(\+\S+\s+)?(install|binstall)\b' }
message = """
cargo install writes a binary into the cargo home's bin directory, which no
rebuild reproduces and no closure records -- a second owner competing with the
profile. cargo binstall is the same outcome by a shorter route: it fetches a
prebuilt binary into the same unowned location.

To run a crate you are developing, do not install it:
  rtk cargo run --bin <name> -- <args>
  rtk cargo build --release   then run the produced binary from the target dir
     (ask cargo where that is: rtk cargo metadata --format-version 1 --no-deps)
To make a tool permanently available, declare it: pin it as a flake input, build
it in a packaging derivation, and let the profile install it.
"""

[[patterns]]
id = "install.global_node_package"
priority = 155
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(npm|pnpm|bun)\s[^\n]*\b(install|add|in|i)\b[^\n]*(--global|-g)\b|(npm|pnpm|bun)\s[^\n]*(--global|-g)\b[^\n]*\b(install|add|in|i)\b|npm\s[^\n]*--location[= ]global|yarn\s+global\s+add\b' }
message = """
A global node install places a binary in a node prefix outside the profile --
a second owner, and one that a rebuild silently reverts. Flag order does not
change that, so `-g` before the subcommand and `--location=global` are the same
violation as `install -g`.

Use the profile-owned Bun lane, never Node/npm/npx or a user-bin shadow. The
flake contract asserts npm, npx, pnpm, corepack and yarn are ABSENT from this
profile, so any remedy naming them is broken before it is even run. Bun is
pinned at 1.3.14, and node comes from nodejs_24.

  run a tool once      rtk bun x --bun <tool>@latest <args>
  add a project dep    rtk bun add <pkg>
  install project deps rtk bun install

To make a tool permanent, declare it as a flake input and let the profile own it.
"""

# Anchored at the START of the segment, because evaluate_command() has already
# split on && || ; and pipes. The prefix group absorbs leading VAR=value
# assignments and the sudo/rtk/proxy wrappers, so `rtk npm run build` and
# `rtk proxy -- npx foo` are caught while `rtk grep -E 'npm|npx' file` is not --
# there the token after `rtk` is grep, not a package manager. Matching the bare
# name anywhere in a segment was tried first and denied ordinary searches.
[[patterns]]
id = "install.node_lane_absent"
priority = 150
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '^(?:\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S*|sudo|rtk|proxy|--)\s+)*(?:npm|npx|pnpm|yarn|corepack)\b' }
message = """
This profile has no npm, npx, pnpm, yarn or corepack. The flake contract asserts
all five are ABSENT, so the command cannot run -- it is not a style preference.

bun and bun x are their drop-in replacements, pinned at 1.3.14:

  npx <tool> <args>      -> rtk bun x --bun <tool>@latest <args>
  npm install            -> rtk bun install
  npm install <pkg>      -> rtk bun add <pkg>
  npm run <script>       -> rtk bun run <script>
  pnpm / yarn <anything> -> the matching rtk bun form above

Run tools at @latest rather than freezing an old version. To make a tool
permanent, declare it as a flake input and let the profile own it; a global
install is denied separately by install.global_node_package.
"""

[[patterns]]
id = "install.user_site_package"
priority = 155
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'pip3?\s+install\b[^\n]*--user\b|pipx\s+install\b|uv\s+tool\s+install\b|go\s+install\b' }
message = """
This installs a binary into a per-user location outside the profile, which no
rebuild reproduces.

Run it without owning it:
  python -> rtk uvx <tool> <args>     (or run inside a project virtualenv)
  go     -> rtk go run <package> <args>
To make it permanent, declare it as a flake input and let the profile own it.
"""

# ── RTK frontdoor ───────────────────────────────────────────────────────────
#
# RTK is the mandated frontdoor for shell work here, and the documented golden
# rule is explicit that this holds INSIDE CHAINS TOO -- `rtk git add . && git
# commit` is the canonical violation, because the first segment is disciplined
# and every later one silently is not.
#
# Anchored on ^ alone, because evaluate_command() has ALREADY split the command
# on && || ; and standalone pipes before a pattern is tested. Matching the
# delimiters here as well would fire on a semicolon inside a quoted string.
#
# The set is the full documented RTK command list. Earlier drafts carved out
# grep, ls, env, curl, diff and wget on the assumption that a prefix would break
# them; every one of those assumptions was tested and FALSE:
#
#   printf ... | rtk grep -c foo   -> correct count from stdin
#   rtk ls -la FILE                -> mode preserved (octal 664, not symbolic)
#   rtk env -i HOME=x FOO=bar CMD  -> clean-env invocation works
#   rtk diff -q A B                -> correct quiet compare
#
# The golden rule is literal: RTK uses a filter when it has one and passes the
# command through unchanged when it does not, so it is always safe. Do not add
# an exclusion here without a transcript showing the prefixed form failing.
#
# `test` is the one empirically-broken name and stays out: `rtk test` is the
# generic TEST-RUNNER wrapper, so `rtk test -x FILE` prints runner help instead
# of evaluating the file predicate. Shell builtins and keywords (cd, export,
# read, for, if) cannot be prefixed at all, and the RTK-internal subcommand
# names (log, json, deps, summary, err) are not standalone commands.

# This rule is DENY-BY-DEFAULT and therefore lives in code, not here: it must
# match a segment whose first token is NOT rtk, and the regex crate has no
# lookahead. See evaluate_rtk_frontdoor() in src/guard.rs. An allowlist of
# "tools that need the prefix" was the wrong shape -- it silently permits every
# command nobody remembered to list, which is the same hole the rule exists to
# close.
