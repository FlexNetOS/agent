# Agent Guard Policy — consolidated destructive-command policy (ARCHBP-031)
# Schema Version: 1.1 (adds per-pattern `decision = "deny" | "ask"`; default "deny")
#
# OWNERSHIP — one source owns each rule:
#   CANONICAL: Meta's tracked .claude/agent-guard.toml. Meta is the workspace
#     control plane and owns its tracked policy.
#   MIRROR (traceable, byte-identical): the `agent` peer's
#     .claude/agent-guard.toml, compiled into the `agent` binary as its embedded
#     default fallback.
#   ADAPTERS may refine parsing on their own hook routes, but may not become a
#     policy source or override these decisions.
#
# Load hierarchy of the engine: ./.claude/agent-guard.toml (project) ->
# ~/.claude/agent-guard.toml (user) -> embedded default. All policy copies used
# for this workspace must carry this consolidated content; a project-level fork
# is a policy fork and must be treated as an incident.
#
# envctl has no authority over this policy. Do not infer authority from a local
# projection, a generated file, or a tool being present on this host.
#
# NUSHELL-ONLY AGENT PLANE (YZXCONV-017): agents execute shell actions only
# through the profile-owned Nushell; Bash/sh/zsh/fish/xonsh are owner-only, with
# a per-incident owner-approved emergency fallback solely after a system crash.
# This policy file adds no alternate-shell permission; launcher/hook enforcement
# of the shell boundary is YZXCONV-017 scope and must not be weakened here.
#
# Decision semantics: "deny" blocks the tool call; "ask" escalates to the
# operator (PreToolUse permissionDecision "ask"). Unknown values fail closed to
# "deny". First match wins, highest priority first.

schema_version = "1.1"

[metadata]
source = "flexnetos-meta"
version = "0.2.0"
description = "Consolidated agent guard policy (ARCHBP-031): single source, adapters consume"

# ── Claude session containment ──────────────────────────────────────────────

[[patterns]]
id = "meta.claude.skip_permissions"
priority = 130
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '--dangerously-skip-permissions' }
message = """
LAW: --dangerously-skip-permissions is forbidden on this machine, no exceptions.
"""

[[patterns]]
id = "meta.claude.nested_session"
priority = 120
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '^\s*(rtk\s+|sudo\s+)?claude(\s|$)' }
validator = { type = "all_of", validators = [{ type = "not_contains", value = "--version" }, { type = "not_contains", value = "claude update" }, { type = "not_contains", value = "claude doctor" }] }
message = """
Nested Claude sessions are denied (recursion containment). Allowed:
'claude --version', 'claude update', 'claude doctor'. Use teams/subagents/background
bash instead. (Baseline rule; guard-bash.sh refines with quote-aware parsing.)
"""

# ── git topology protection ─────────────────────────────────────────────────

[[patterns]]
id = "meta.git.force_push_longlived"
priority = 110
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*(--force|-f\b|\s\+\S+)' }
validator = { type = "args_match_any", command = "push", values = ["main", "master", "develop", "+main", "+master", "+develop"] }
message = """
Force-push (any variant, including --force-with-lease and +refspec) touching
main/master/develop is forbidden — long-lived branches are upgrade-only history.
"""

[[patterns]]
id = "meta.git.force_push"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+push.*(--force|-f)\b' }
validator = { type = "not_contains", value = "--force-with-lease" }
message = """
git push --force in a multi-repo workspace can overwrite history across \
multiple repos. Safer alternatives:
- git push --force-with-lease on a private feature branch (operator-approved)
- meta --include <repo> exec -- git push (target one repo)
- meta git snapshot create <name> before risky pushes
"""

[[patterns]]
id = "meta.git.push_refspec_force"
priority = 95
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = 'git\s+push.*\s\+\S+' }
message = """
'+refspec' push force-updates the remote ref. Approve only for a private
feature branch you know is disposable.
"""

[[patterns]]
id = "meta.git.force_push_lease"
priority = 90
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = 'git\s+push.*--force-with-lease' }
message = """
--force-with-lease rewrites remote history (with an upstream check). Approve
only for a private feature branch.
"""

[[patterns]]
id = "meta.git.branch_force_delete_longlived"
priority = 110
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+branch.*\s+-[a-zA-Z]*D[a-zA-Z]*(\s|$)' }
validator = { type = "args_match_any", command = "branch", values = ["main", "master", "develop"] }
message = """
Topology invariant: main/master/develop are long-lived and never force-deleted.
"""

[[patterns]]
id = "meta.git.branch_force_delete"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+branch.*\s+-[a-zA-Z]*D[a-zA-Z]*(\s|$)' }
message = """
git branch -D force-deletes branches, potentially losing unmerged work. \
Safer alternatives:
- git branch -d <branch> (safe delete — only works if merged)
- git branch -v to check merge status first
- meta git snapshot create <name> before deleting
"""

[[patterns]]
id = "meta.git.history_rewrite"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git[-\s]+filter-branch|git[-\s]+filter-repo|git\s+reflog\s+expire.*--expire|git\s+gc\b.*--prune=now' }
message = """
History rewrites / reflog destruction are forbidden (LAW 1 + upgrade-only).
Archive instead.
"""

[[patterns]]
id = "meta.git.reset_hard"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+reset.*--hard\b' }
message = """
git reset --hard destroys uncommitted work. In a multi-repo workspace, \
this can silently discard changes across repos. Safer alternatives:
- meta git snapshot create <name> (save state first)
- meta git snapshot restore <name> (reversible reset)
"""

[[patterns]]
id = "meta.git.clean_force"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+clean' }
validator = { type = "flags_present", command = "clean", flags = ["f", "d"] }
message = """
git clean -fd removes untracked files and directories permanently. \
Safer alternatives:
- git clean -nd (dry run — preview what would be removed)
- meta git snapshot create <name> before cleaning
"""

[[patterns]]
id = "meta.git.checkout_dot"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+checkout\s+(--\s+)?\.(\s|$)' }
message = """
git checkout . reverts all modified files. Safer alternatives:
- git checkout -- <specific-file> (target specific files)
- meta git snapshot create <name> before reverting
"""

[[patterns]]
id = "meta.git.stash_drop"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+stash\s+drop\b' }
message = """
git stash drop permanently removes a stash entry. Safer alternatives:
- git stash list to review what will be dropped
- git stash show <stash> to inspect contents first
- git stash apply <stash> instead of pop (preserves the stash)
"""

[[patterns]]
id = "meta.git.stash_clear"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'git\s+stash\s+clear\b' }
message = """
git stash clear removes ALL stash entries permanently. Safer alternatives:
- git stash list to review what will be cleared
- git stash drop <stash> to remove specific entries one at a time (guarded)
- meta git snapshot create <name> before clearing (captures all stashes)
"""

# ── filesystem protection ───────────────────────────────────────────────────

[[patterns]]
id = "meta.rm.dangerous_paths"
priority = 100
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = 'rm\s+' }
validator = { type = "all_of", validators = [{ type = "flags_present", command = "rm", flags = ["r", "f"] }, { type = "args_match_any", command = "rm", values = [".", "..", "/", "~", "$HOME", ".meta", ".meta.yaml", ".meta.yml", "*", "./*", "../*", "./"] }] }
message = """
rm -rf on dangerous paths could destroy repo roots or workspace data. \
LAW 1: never delete, always archive. Safer alternatives:
- Remove specific scratch files instead of entire directories
- meta --dry-run exec -- <cmd> to preview operations
- meta git snapshot create <name> before destructive operations
(Hook adapters may apply parser refinements, but this policy remains the
decision source.)
"""

# ── path law ────────────────────────────────────────────────────────────────
#
# SOURCING LAW, and the reason this section exists at all:
#
#   A rule may encode a DOCUMENTED SURFACE -- a variable whose owner defines it.
#   Upstream yazelix owns YAZELIX_STATE_DIR and the YZX_* binary surfaces; the
#   XDG spec owns XDG_CONFIG_HOME and XDG_RUNTIME_DIR; cargo owns CARGO_HOME;
#   each agent owns its own home variable.
#
#   A rule may NEVER encode THIS HOST'S POLICY about where a surface points.
#   That is not law, it is local configuration, and freezing it into a guard
#   makes the configuration permanent by making it enforced.
#
# Two rules were removed for violating exactly that. `durable_cache_on_volatile`
# denied five cache variables from resolving under the runtime dir, and
# `cache_surface_hardcoded` asserted twelve vendor caches must derive from
# XDG_CACHE_HOME. Both were read off this machine's nushell config layer -- a
# file that does not exist upstream -- so the guard had begun protecting the
# drift it was written to stop. A census of the box is not a source of truth;
# it is a description of the damage.
#
# What remains is shape, not location. The rules below fire on the FORM of a
# path -- a dotdir under a user home, build state on a runtime tmpfs, a store
# path pinned by hash, a documented surface assigned a literal -- and none of
# them names a directory this profile chose. They hold for any user, at any
# uid, on any box, which is the test for whether a rule belongs here.
#
# Upstream Yazelix's resolver is the reference shape: a precedence chain over
# surfaces, ending in a fallback (runtime/yzx/paths.rs):
#
#   state   YAZELIX_STATE_DIR -> $XDG_DATA_HOME/yazelix
#             -> $HOME/.local/share/yazelix -> /tmp/yazelix
#   config  YAZELIX_CONFIG_HOME -> $XDG_CONFIG_HOME/yazelix
#             -> $HOME/.config/yazelix
#
# Both terminal fallbacks are upstream-documented and MUST stay permitted.
# Reaching one means no surface was set; the repair is to set the surface, never
# to fight the path. Empty is unset -- upstream reads through nonempty_env.
#
# This policy is host-agnostic and guards writes. Host repair authority must be
# proven separately; it is never conferred by a local tool or projection.

[[patterns]]
id = "paths.dotlocal_tool_state"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(/home/[^/\s]+|\$HOME|~)/\.(local/(share|state)|config)/(icm|rtk|weave|atc|env-ctl|ccboard)' }
message = """
FlexNetOS tool state is reached through the XDG surface, never by naming a path
under the user home.
  data   -> $XDG_DATA_HOME/<tool>
  state  -> $XDG_STATE_HOME/<tool>
Both are exported by the profile frontdoor, so the tool's own XDG resolution
finds them with no path in your command at all.

If a tool is landing under ~/.local anyway, its surface is unset in that
process -- repair the owning configuration, not the path in an agent command.
"""

[[patterns]]
id = "paths.agent_home_shadow"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(/home/[^/\s]+|\$HOME|~)/\.(codex|claude|gemini|copilot)($|[/\s"\x27:,;)\]}])' }
message = """
Each agent home is a surface, not a path. Read the variable:
  CODEX_HOME   CLAUDE_CONFIG_DIR   GEMINI_CONFIG_DIR   COPILOT_HOME
The owning agent frontdoor may reject a competing home by byte-for-byte string
comparison, so writing ~/.codex or ~/.claude does not merely look untidy -- it
can make that agent refuse to launch. Change an agent home only through its
proved owner.
"""

[[patterns]]
id = "paths.build_state_on_runtime_dir"
priority = 200
enabled = true
decision = "deny"
matcher = { type = "regex", pattern = '(CARGO_HOME|CARGO_TARGET_DIR|RUSTUP_HOME|GOCACHE|GOMODCACHE)\s*=\s*[^\s]*(/run/user/\d+|\$XDG_RUNTIME_DIR)' }
message = """
Build state must not resolve under $XDG_RUNTIME_DIR. That is a tmpfs whose
budget is shared with the wayland socket, dconf, dbus and gnome-keyring, and it
is cleared on logout -- a workspace build reached 30G there and drove it to 84%.
The symptom is a binary that "does not exist" right after cargo reports success.
Use the durable surface: $CARGO_HOME / $CARGO_TARGET_DIR are already exported.
Never assume ./target either -- ask cargo where it actually put things:
  cargo metadata --format-version 1 --no-deps | jq -r .target_directory
$XDG_RUNTIME_DIR is correct for genuinely disposable caches, and only those.
"""

[[patterns]]
id = "paths.yazelix_surface_hardcoded"
priority = 160
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = '(YAZELIX_STATE_DIR|YAZELIX_CONFIG_HOME|XDG_CONFIG_HOME|XDG_DATA_HOME|XDG_STATE_HOME|XDG_CACHE_HOME|XDG_RUNTIME_DIR|CODEX_HOME|CLAUDE_CONFIG_DIR|GEMINI_CONFIG_DIR|COPILOT_HOME|CARGO_HOME|CARGO_TARGET_DIR|TMPDIR)\s*=\s*[\x27"]?/' }
message = """
This assigns a surface an absolute literal. Surfaces are what make upstream
work for any user on any box, so pinning one to a path is how a host stops
being reproducible.

Upstream Yazelix's shape is a precedence chain, not an assignment:
  YAZELIX_STATE_DIR -> $XDG_DATA_HOME/yazelix -> $HOME/.local/share/yazelix

Approve only where a surface genuinely must be pinned by its proved owner --
for example, Yazelix's profile frontdoor. A pinned value can require
byte-for-byte identity with the frontdoor's own value when the owner compares
raw strings.

Everywhere else, read the surface instead of setting it. Never hand-edit the
owner's live configuration table; use that owner's documented committer.
"""

[[patterns]]
id = "paths.nix_store_hardcoded"
priority = 150
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = '(^|["\x27=\s])/nix/store/[a-z0-9]{32}-' }
message = """
This names a /nix/store path by hash. Store paths change on every rebuild, so a
pinned one is stale as soon as anything upstream of it moves.
  in nix   -- reference the derivation, or builtins.storeDir
  at run   -- $YAZELIX_NIX_STORE_ROOT, which upstream sets from builtins.storeDir
  on PATH  -- the profile frontdoor, /home/<user>/.nix-profile/toolbin/<tool>
Approve for one-off inspection of a specific store path.
"""

[[patterns]]
id = "paths.rustup_not_used"
priority = 150
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = 'RUSTUP_HOME|rustup\s+(install|default|toolchain|override)' }
message = """
This profile has no rustup. The Rust toolchain comes from FENIX
(nix-community), composed in the yazelix flake:

  flexnetosRustToolchain = fenixPkgs.combine [cargo rustc rustfmt clippy rust-analyzer]

fenix REPLACES rustup -- the MSRV lane even wraps cargo with
--unset RUSTUP_TOOLCHAIN. Setting RUSTUP_HOME or invoking rustup introduces a
second toolchain owner. To change the toolchain, edit the flake input.
"""

[[patterns]]
id = "paths.profile_package_for_build_input"
priority = 150
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = 'nix\s+profile\s+(add|install).*(openssl|pkg-config|onnxruntime|zlib|sqlite)|PKG_CONFIG_PATH=' }
message = """
C build inputs come from a derivation's buildInputs -- never from the user
profile, and never from PKG_CONFIG_PATH in a shell config. Adding one to the
profile makes the build succeed for you and fail for everyone else. That is
drift, not a fix.

Working example -- packaging/icm_release.nix:
  nativeBuildInputs = [ pkgs.pkg-config ];
  buildInputs       = [ pkgs.openssl pkgs.onnxruntime ];
  OPENSSL_NO_VENDOR = "1";

If a raw `cargo build` fails on a -sys crate, build it through nix, or use the
CI devshell that already carries pkg-config:
  nix develop path:<yazelix>#ci
"""

[[patterns]]
id = "paths.binary_surface_hardcoded"
priority = 160
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = '(YZX_ZELLIJ|YZX_YAZI_BIN|YZX_YA|YZX_EDITOR|YZX_MENU_YZX|YZX_OPEN_LOG|YAZELIX_AGENT_LAUNCHER|YAZELIX_PACKAGED_YAZI|YAZELIX_EDITOR|EDITOR|VISUAL|GIT_EDITOR|SHELL)\s*=\s*["\x27]?/' }
message = """
This pins a BINARY surface to a path. Upstream locates its own tools through
these, each set from a nix derivation, so pinning one to a literal detaches the
tool from the closure that built it and outlives the rebuild that moved it.

  YZX_ZELLIJ  YZX_YAZI_BIN  YZX_YA  YZX_EDITOR  YZX_MENU_YZX  YZX_OPEN_LOG
  YAZELIX_AGENT_LAUNCHER  YAZELIX_PACKAGED_YAZI

Upstream reads them with a fallback to the bare command name, e.g.
  zellij: nonempty_env("YZX_ZELLIJ").unwrap_or_else(|| "zellij".into())
so an unset surface is a supported state -- resolution falls back to PATH, which
the profile owns. Read the surface; let nix set it.

Approve inside a nix expression that is legitimately producing the value.
"""

[[patterns]]
id = "paths.tmpdir_hardcoded"
priority = 140
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = '(^|["\x27=\s])/tmp/[A-Za-z0-9._-]' }
message = """
This writes to /tmp directly. $TMPDIR is the surface, and this profile points it
at the session-volatile root so scratch files are cleaned with the session
instead of accumulating in a shared world-writable directory.

Upstream's own last-resort state fallback is env::temp_dir()/yazelix, which
honours $TMPDIR -- so even there /tmp is reached through the surface, never named.

Use $TMPDIR, or the session scratch directory when one is provided.
Approve for genuinely throwaway inspection.
"""

[[patterns]]
id = "paths.config_surface_hardcoded"
priority = 160
enabled = true
decision = "ask"
matcher = { type = "regex", pattern = '(YAZELIX_HELIX_MANAGED_CONFIG_PATH|YAZELIX_HELIX_BRIDGE|YAZELIX_NIX_STORE_ROOT|YAZELIX_STATUS_BAR_CACHE_PATH|YAZELIX_CURSOR_CONFIG|YZX_YAZI_STARSHIP_CONFIG|HELIX_STEEL_CONFIG|LG_CONFIG_FILE)\s*=\s*["\x27]?/' }
message = """
This pins a Yazelix-owned config or runtime-path surface. Yazelix defines these
surfaces; their values must travel with the runtime or resolver that owns them,
not with an arbitrary shell command.

  YAZELIX_HELIX_MANAGED_CONFIG_PATH   YAZELIX_HELIX_BRIDGE
  YAZELIX_STATUS_BAR_CACHE_PATH       YAZELIX_CURSOR_CONFIG
  YZX_YAZI_STARSHIP_CONFIG            HELIX_STEEL_CONFIG
  LG_CONFIG_FILE

Read the surface. Approve inside the Yazelix source or runtime layer that
legitimately produces the value.
"""

# ── RTK frontdoor ───────────────────────────────────────────────────────────
#
# RTK is the mandated frontdoor for shell work here, and the documented golden
# rule is explicit that this holds INSIDE CHAINS TOO -- `rtk git add . && git
# commit` is the canonical violation, because the first segment is disciplined
# and every later one silently is not.
#
# Anchored on ^ alone, because evaluate_command() has ALREADY split the command
# on && || ; and standalone pipes before a pattern is tested. Matching the
# delimiters here as well would fire on a semicolon inside a quoted string.
#
# The set is the full documented RTK command list. Earlier drafts carved out
# grep, ls, env, curl, diff and wget on the assumption that a prefix would break
# them; every one of those assumptions was tested and FALSE:
#
#   printf ... | rtk grep -c foo   -> correct count from stdin
#   rtk ls -la FILE                -> mode preserved (octal 664, not symbolic)
#   rtk env -i HOME=x FOO=bar CMD  -> clean-env invocation works
#   rtk diff -q A B                -> correct quiet compare
#
# The golden rule is literal: RTK uses a filter when it has one and passes the
# command through unchanged when it does not, so it is always safe. Do not add
# an exclusion here without a transcript showing the prefixed form failing.
#
# `test` is the one empirically-broken name and stays out: `rtk test` is the
# generic TEST-RUNNER wrapper, so `rtk test -x FILE` prints runner help instead
# of evaluating the file predicate. Shell builtins and keywords (cd, export,
# read, for, if) cannot be prefixed at all, and the RTK-internal subcommand
# names (log, json, deps, summary, err) are not standalone commands.

# This rule is DENY-BY-DEFAULT and therefore lives in code, not here: it must
# match a segment whose first token is NOT rtk, and the regex crate has no
# lookahead. See evaluate_rtk_frontdoor() in src/guard.rs. An allowlist of
# "tools that need the prefix" was the wrong shape -- it silently permits every
# command nobody remembered to list, which is the same hole the rule exists to
# close.
